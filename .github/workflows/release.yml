name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stage .yymps package contents
        run: node .github/scripts/stage-yymps.js "${{ steps.version.outputs.version }}" stage/gmfx_lib

      - name: Zip .yymps package
        run: |
          cd stage/gmfx_lib
          zip -r -X "../../gmfx_lib.yymps" .

      - name: Stage prefab .yymps package contents
        run: node .github/scripts/stage-yymps.js "${{ steps.version.outputs.version }}" stage/gmfx_lib-prefab --with-prefab

      - name: Zip prefab .yymps package
        run: |
          cd stage/gmfx_lib-prefab
          zip -r -X "../../gmfx_lib.gmclan-org-${{ steps.version.outputs.version }}.yymps" .

      - name: Stage .tgz package contents
        run: |
          mkdir -p stage/tgz/package
          cp "gmfx_lib.gmclan-org-${{ steps.version.outputs.version }}.yymps" stage/tgz/package/
          cp stage/gmfx_lib-prefab.package.json stage/tgz/package/package.json

      - name: Pack .tgz
        run: |
          cd stage/tgz
          tar -czf "../../gmfx_lib.gmclan-org-${{ steps.version.outputs.version }}.tgz" package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gmfx_lib.yymps
            gmfx_lib.gmclan-org-${{ steps.version.outputs.version }}.yymps
            gmfx_lib.gmclan-org-${{ steps.version.outputs.version }}.tgz
          generate_release_notes: true
