name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stage .yymps package contents
        run: node .github/scripts/stage-yymps.js "${{ steps.version.outputs.version }}" stage/gmfx_lib

      - name: Zip .yymps package
        run: |
          cd stage/gmfx_lib
          zip -r -X "../../gmfx_lib.yymps" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gmfx_lib.yymps
          generate_release_notes: true
