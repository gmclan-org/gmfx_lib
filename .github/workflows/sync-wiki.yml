name: Sync Docs to Wiki

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**' # only when there are changes

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Upload to GitHub Wiki
        uses: spenserblack/actions-wiki@v0.3.0
        with:
          path: docs